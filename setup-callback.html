<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>2FA Setup Complete</title>
  <style>
    body {
      background-color: #0b0f19;
      color: #f3f4f6;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
      text-align: center;
    }
    .card {
      background: #111827;
      border: 1px solid #1f293d;
      border-radius: 12px;
      padding: 32px 24px;
      max-width: 380px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
    }
    .icon {
      font-size: 40px;
      margin-bottom: 12px;
    }
    h2 {
      margin: 0 0 8px;
      font-size: 18px;
      color: #34d399;
    }
    p {
      margin: 0;
      font-size: 13px;
      color: #9ca3af;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon">✅</div>
    <h2>2FA успешно привязана!</h2>
    <p>Это окно закроется автоматически через секунду...</p>
  </div>
  <script>
    try {
      if (window.opener) {
        window.opener.postMessage({ type: '2FA_SETUP_SUCCESS' }, '*');
      }
    } catch (e) {
      console.warn('Could not postMessage to opener:', e);
    }
    setTimeout(() => {
      window.close();
    }, 700);
  </script>
</body>
</html>
